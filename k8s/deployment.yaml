apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-benchmark
  template:
    metadata:
      labels:
        app: matrix-benchmark
    spec:
      containers:
        - name: matrix-benchmark
          image: matrix-benchmark:latest
          imagePullPolicy: Never
          args: ["--daemon", "--host", "0.0.0.0", "--port", "9000"]
          ports:
            - name: benchmark
              containerPort: 9000
              protocol: TCP
